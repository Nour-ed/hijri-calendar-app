name: بناء APK (التقويم الهجري)

on:
  workflow_dispatch:        # تشغيل يدوي
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 تحميل الكود
        uses: actions/checkout@v4

      - name: ☕ إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: 📄 نسخ آخر إصدار من HTML إلى assets
        run: |
          cp "التقويم_الهجري.html" android/app/src/main/assets/

      - name: 🔨 بناء APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: التقويم_الهجري-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 📦 تحضير APK للتحميل
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk التقويم_الهجري.apk

      - name: 📎 رفع APK كـ Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: التقويم_الهجري.apk
          generate_release_notes: true
